<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0d">
<title>Мои Тренировки</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d0d;
  --surface:#161616;
  --card:#1e1e1e;
  --card2:#252525;
  --accent:#e8ff00;
  --accent2:#ff6b35;
  --text:#f0f0f0;
  --muted:#888;
  --border:#2a2a2a;
  --gold:#c9a84c;
  --goldd:#a07c28;
  --goldg:rgba(201,168,76,0.12);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}
html{height:100%;overflow-x:hidden}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-left:var(--safe-left);padding-right:var(--safe-right)}

/* ── HERO ── */
.hero{
  padding: calc(var(--safe-top) + 16px) 16px 14px;
  background:linear-gradient(160deg,#1a1a1a,#0d0d0d);
  border-bottom:1px solid var(--border);
  position:relative;overflow:hidden
}
.hero::before{content:'';position:absolute;top:-30px;right:-30px;width:160px;height:160px;background:radial-gradient(circle,rgba(232,255,0,.07),transparent 70%);border-radius:50%}
.hero-label{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:2px;line-height:1}
.hero h1 span{color:var(--accent)}

/* ── TOP NAV (sticky) ── */
nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.nav-btn{flex:1;padding:15px 8px;background:none;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;letter-spacing:.1em;text-transform:uppercase;min-height:48px}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── TOP BAR ── */
.top-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.btn-save{background:var(--accent);border:none;color:#000;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;padding:10px 20px;border-radius:50px;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;transition:all .15s;min-height:44px;flex-shrink:0}
.btn-save:active{background:#d4eb00;transform:scale(.97)}
.saved-msg{font-size:11px;color:var(--accent);letter-spacing:.1em;opacity:0;transition:opacity .4s;font-weight:600;flex-shrink:0}
.saved-msg.show{opacity:1}
.week-nav-wrap{display:flex;align-items:center;gap:4px;margin-left:auto}
.week-arrow{background:none;border:1px solid var(--border);color:var(--muted);font-size:18px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.week-arrow:active{border-color:var(--accent);color:var(--accent)}
.week-label{font-size:10px;font-weight:600;color:var(--text);min-width:90px;text-align:center;letter-spacing:.02em}

/* ── PAGES ── */
.page{display:none;padding:12px 16px calc(var(--safe-bottom) + 24px)}
.page.active{display:block}

/* ── DAY CARD ── */
.day-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.day-card.open{border-color:#3a3a3a}
.day-head{padding:16px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;border-left:3px solid var(--accent);min-height:60px}
.day-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px}
.day-focus{font-size:10px;color:var(--accent);letter-spacing:.2em;text-transform:uppercase;margin-top:3px;font-weight:600}
.day-arrow{color:var(--muted);transition:transform .25s;font-size:14px}
.day-card.open .day-arrow{transform:rotate(180deg)}
.day-body{display:none}
.day-card.open .day-body{display:block}

/* ── EXERCISE ROW ── */
.ex-row{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-top:1px solid var(--border);position:relative}
.muscle-icon{width:50px;height:50px;border-radius:10px;flex-shrink:0;background:var(--card2);border:1px solid var(--border);overflow:hidden;display:flex;align-items:center;justify-content:center}
.muscle-icon svg{width:42px;height:42px}
.ex-main{flex:1;min-width:0;padding-right:40px}
.ex-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.35;margin-bottom:2px}
.ex-sub{font-size:11px;color:var(--muted);margin-bottom:2px;letter-spacing:.03em}
.ex-default{font-size:10px;color:var(--accent);margin-bottom:10px;opacity:.7;font-weight:600}
.ex-fields{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field-group{display:flex;flex-direction:column;gap:4px}
.field-lbl{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.field-in{
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700;
  text-align:center;width:80px;padding:10px 4px;outline:none;
  transition:border-color .2s,box-shadow .2s;-moz-appearance:textfield;
  min-height:44px
}
.field-in::-webkit-outer-spin-button,.field-in::-webkit-inner-spin-button{-webkit-appearance:none}
.field-in:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(232,255,0,.15)}
.field-in::placeholder{color:rgba(136,136,136,.35)}
.weight-hint{font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.03em;min-height:14px}
.weight-hint.carry{color:var(--gold);opacity:.9}
.ex-delete{
  position:absolute;top:12px;right:12px;
  background:none;border:none;color:rgba(136,136,136,.35);
  font-size:16px;cursor:pointer;
  width:36px;height:36px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  transition:color .2s,background .2s
}
.ex-delete:active{color:#ff5555;background:rgba(255,85,85,.12)}

.add-ex-btn{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:14px 16px;background:none;border:none;border-top:1px solid var(--border);
  color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;
  cursor:pointer;letter-spacing:.1em;text-transform:uppercase;transition:all .2s;
  min-height:50px
}
.add-ex-btn:active{color:var(--accent);background:rgba(232,255,0,.05)}
.add-ex-btn .plus{font-size:22px;line-height:1;color:var(--accent)}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(5,5,5,.88);z-index:200;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px)}
.modal-overlay.open{display:flex}
.modal{
  background:var(--surface);border:1px solid var(--border);
  border-radius:24px 24px 0 0;
  padding:28px 20px calc(var(--safe-bottom) + 28px);
  width:100%;max-width:500px
}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;margin-bottom:18px}
.modal-input{
  width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;
  font-size:16px;padding:13px 14px;outline:none;margin-bottom:10px;
  transition:border-color .2s;min-height:48px
}
.modal-input:focus{border-color:var(--accent)}
.modal-select{
  width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;
  font-size:16px;padding:13px 14px;outline:none;margin-bottom:18px;
  cursor:pointer;appearance:none;min-height:48px
}
.modal-select option{background:var(--surface)}
.modal-btns{display:flex;gap:10px}
.modal-ok{
  flex:1;background:var(--accent);border:none;color:#000;
  font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;
  padding:14px;border-radius:50px;cursor:pointer;
  transition:background .2s;text-transform:uppercase;letter-spacing:.06em;min-height:50px
}
.modal-ok:active{background:#d4eb00}
.modal-cancel{
  flex:1;background:none;border:1px solid var(--border);color:var(--muted);
  font-family:'DM Sans',sans-serif;font-size:15px;
  padding:14px;border-radius:50px;cursor:pointer;transition:all .2s;min-height:50px
}
.modal-cancel:active{border-color:var(--text);color:var(--text)}

/* ── CARDIO ── */
.cardio-row{padding:14px 16px;border-top:1px solid var(--border)}
.cardio-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cardio-icon{width:50px;height:50px;border-radius:10px;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cardio-icon svg{width:32px;height:32px}
.cardio-name{font-size:14px;font-weight:600;color:var(--text)}
.cardio-hint{font-size:11px;color:var(--muted);margin-top:2px}
.cardio-fields{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.cardio-sel{
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;
  padding:10px 10px;outline:none;cursor:pointer;transition:border-color .2s;
  max-width:150px;min-height:44px
}
.cardio-sel:focus{border-color:var(--accent)}
.cardio-sel option{background:var(--surface)}

/* ── RECORDS PAGE ── */
.page-title{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:2px;margin-bottom:4px}
.page-sub{font-size:10px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-bottom:20px;font-weight:600}
.rec-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
.rec-muscle{width:64px;height:64px;border-radius:10px;background:var(--card2);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.rec-muscle svg{width:52px;height:52px}
.rec-info{flex:1;min-width:0}
.rec-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;margin-bottom:1px}
.rec-sub{font-size:10px;color:var(--accent);letter-spacing:.18em;text-transform:uppercase;margin-bottom:10px;font-weight:600}
.rec-fields{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.rec-inp{
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700;
  text-align:center;width:84px;padding:10px 6px;outline:none;
  transition:border-color .2s,box-shadow .2s;-moz-appearance:textfield;min-height:44px
}
.rec-inp::-webkit-outer-spin-button,.rec-inp::-webkit-inner-spin-button{-webkit-appearance:none}
.rec-inp:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(232,255,0,.12)}
.rec-unit{font-size:11px;color:var(--muted);font-weight:600}
.rec-badge{display:inline-flex;align-items:center;background:rgba(232,255,0,.1);color:var(--accent);font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;border:1px solid rgba(232,255,0,.25);margin-top:8px;letter-spacing:.05em}
.section-lbl{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:14px 0 6px;border-bottom:1px solid var(--border);margin-bottom:10px}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-label">Твоя программа</div>
  <h1>МОИ <span>ТРЕНИРОВКИ</span></h1>
</div>

<nav>
  <button class="nav-btn active" id="nav-plan" onclick="showPage('plan')">📋 ПЛАН</button>
  <button class="nav-btn" id="nav-records" onclick="showPage('records')">🏆 РЕКОРДЫ</button>
</nav>

<div class="top-bar">
  <button class="btn-save" onclick="saveAll()">Сохранить</button>
  <span class="saved-msg" id="saved-msg">✓ Сохранено</span>
  <div class="week-nav-wrap">
    <button class="week-arrow" onclick="changeWeek(-1)">‹</button>
    <div class="week-label" id="week-label"></div>
    <button class="week-arrow" onclick="changeWeek(1)">›</button>
  </div>
</div>

<div id="page-plan" class="page active"></div>
<div id="page-records" class="page"></div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">Добавить упражнение</div>
    <input class="modal-input" id="modal-name" placeholder="Название упражнения" maxlength="80">
    <input class="modal-input" id="modal-sub" placeholder="Группа мышц (необязательно)" maxlength="60">
    <select class="modal-select" id="modal-muscle">
      <option value="chest">Грудь</option>
      <option value="bicep">Бицепс</option>
      <option value="tricep">Трицепс</option>
      <option value="frontdelt">Передняя дельта</option>
      <option value="midshoulder">Средняя дельта</option>
      <option value="reardelt">Задняя дельта</option>
      <option value="back">Широчайшие</option>
      <option value="trap">Трапеция</option>
      <option value="quad">Квадрицепс</option>
      <option value="hamstring">Бицепс бедра</option>
      <option value="glute">Ягодицы</option>
      <option value="hyper">Разгибатели спины</option>
      <option value="cardio">Кардио / Другое</option>
    </select>
    <div class="modal-btns">
      <button class="modal-ok" onclick="confirmAddEx()">Добавить</button>
      <button class="modal-cancel" onclick="closeModal()">Отмена</button>
    </div>
  </div>
</div>

const DEFAULT_RECORDS = [
  {id:'bench',name:'Жим лёжа',sub:'Грудь / Трицепс',muscle:'chest'},
  {id:'squat',name:'Приседание',sub:'Ноги / Ягодицы',muscle:'quad'},
  {id:'deadlift',name:'Становая тяга',sub:'Спина / Ноги',muscle:'back'},
];

const CARDIO_TYPES=['🚴 Велосипед','🏃 Бег','🚶 Ходьба','🏊 Плавание'];

let days = JSON.parse(JSON.stringify(DEFAULT_DAYS));
let records = JSON.parse(JSON.stringify(DEFAULT_RECORDS));
let weekOffset = 0;
let allData = {};
let recState = {};
let addingToDayId = null;

function loadState(){
  try{
    const d=localStorage.getItem('wt_days5'); if(d) days=JSON.parse(d);
    const a=localStorage.getItem('wt_v5'); if(a) allData=JSON.parse(a);
    const r=localStorage.getItem('wt_rec5'); if(r) recState=JSON.parse(r);
  }catch(e){}
}

// ─── WEEK ─────────────────────────────────────────────────────────────────
function getWeekKey(o){
  const d=new Date(),dy=d.getDay(),mon=new Date(d);
  mon.setDate(d.getDate()-dy+(dy===0?-6:1)+o*7);
  return 'wk_'+mon.getFullYear()+'_'+mon.getMonth()+'_'+mon.getDate();
}
function getWeekLabel(o){
  const d=new Date(),dy=d.getDay(),mon=new Date(d);
  mon.setDate(d.getDate()-dy+(dy===0?-6:1)+o*7);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const f=dt=>dt.getDate()+'.'+String(dt.getMonth()+1).padStart(2,'0');
  return f(mon)+' – '+f(sun)+(o===0?' (сейчас)':'');
}

// ─── WEIGHT CARRY: finds latest saved weight going backwards ─────────────
function getCarriedWeight(exId, fromOffset){
  for(let o=fromOffset-1; o>=fromOffset-12; o--){
    const wd=allData[getWeekKey(o)]||{};
    const w=(wd[exId]||{}).weight;
    if(w && parseFloat(w)>0) return {weight:w, weeksAgo: fromOffset-o};
  }
  return null;
}

function changeWeek(dir){
  collectInputs();
  weekOffset+=dir;
  document.getElementById('week-label').textContent=getWeekLabel(weekOffset);
  fillInputs();
}

// ─── COLLECT / FILL ───────────────────────────────────────────────────────
function collectInputs(){
  const key=getWeekKey(weekOffset);
  if(!allData[key]) allData[key]={};
  document.querySelectorAll('.ex-sets').forEach(el=>{
    if(!allData[key][el.dataset.id]) allData[key][el.dataset.id]={};
    allData[key][el.dataset.id].sets=el.value;
  });
  document.querySelectorAll('.ex-weight').forEach(el=>{
    if(!allData[key][el.dataset.id]) allData[key][el.dataset.id]={};
    allData[key][el.dataset.id].weight=el.value;
  });
  document.querySelectorAll('.ex-height').forEach(el=>{
    if(!allData[key][el.dataset.id]) allData[key][el.dataset.id]={};
    allData[key][el.dataset.id].height=el.value;
  });
  document.querySelectorAll('.c-type').forEach(el=>{ if(!allData[key][el.dataset.id])allData[key][el.dataset.id]={}; allData[key][el.dataset.id].ctype=el.value; });
  document.querySelectorAll('.c-dist').forEach(el=>{ if(!allData[key][el.dataset.id])allData[key][el.dataset.id]={}; allData[key][el.dataset.id].dist=el.value; });
  document.querySelectorAll('.c-time').forEach(el=>{ if(!allData[key][el.dataset.id])allData[key][el.dataset.id]={}; allData[key][el.dataset.id].time=el.value; });
}

function fillInputs(){
  const key=getWeekKey(weekOffset);
  const wd=allData[key]||{};
  document.querySelectorAll('.ex-weight').forEach(el=>{
    const id=el.dataset.id;
    const thisWeekW=(wd[id]||{}).weight||'';
    el.value=thisWeekW;
    // weight hint
    const hint=document.getElementById('wh-'+id);
    if(hint){
      if(thisWeekW && parseFloat(thisWeekW)>0){
        hint.textContent=''; hint.className='weight-hint';
      } else {
        const c=getCarriedWeight(id, weekOffset);
        if(c){
          el.value=c.weight;
          hint.textContent='← перенесено с прошлой недели';
          hint.className='weight-hint carry';
          el.placeholder='0';
        } else {
          hint.textContent=''; hint.className='weight-hint';
          el.placeholder='0';
        }
      }
    }
  });
  document.querySelectorAll('.ex-sets').forEach(el=>{ el.value=(wd[el.dataset.id]||{}).sets||''; });
  document.querySelectorAll('.ex-height').forEach(el=>{ el.value=(wd[el.dataset.id]||{}).height||''; });
  document.querySelectorAll('.c-type').forEach(el=>{ el.value=(wd[el.dataset.id]||{}).ctype||CARDIO_TYPES[0]; });
  document.querySelectorAll('.c-dist').forEach(el=>{ el.value=(wd[el.dataset.id]||{}).dist||''; });
  document.querySelectorAll('.c-time').forEach(el=>{ el.value=(wd[el.dataset.id]||{}).time||''; });
}

// ─── SAVE ────────────────────────────────────────────────────────────────
function saveAll(){
  collectInputs();
  document.querySelectorAll('.rec-w').forEach(el=>{ const id=el.dataset.rid; if(!recState[id])recState[id]={}; recState[id].w=el.value; });
  document.querySelectorAll('.rec-r').forEach(el=>{ const id=el.dataset.rid; if(!recState[id])recState[id]={}; recState[id].r=el.value; updateBadge(id); });
  try{
    localStorage.setItem('wt_days5',JSON.stringify(days));
    localStorage.setItem('wt_v5',JSON.stringify(allData));
    localStorage.setItem('wt_rec5',JSON.stringify(recState));
  }catch(e){}
  const msg=document.getElementById('saved-msg');
  msg.classList.add('show'); setTimeout(()=>msg.classList.remove('show'),2000);
}

function updateBadge(id){
  const r=recState[id]||{}, w=parseFloat(r.w)||0, reps=parseFloat(r.r)||1;
  const b=document.getElementById('badge-'+id);
  if(b){ if(w>0){b.textContent='1ПМ ≈ '+Math.round(w*(1+reps/30))+' кг';b.style.display='inline-flex';}else b.style.display='none'; }
}

function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
}
function toggleDay(id){ document.getElementById('dc-'+id).classList.toggle('open'); }

function openAddEx(dayId){
  addingToDayId=dayId;
  document.getElementById('modal-name').value='';
  document.getElementById('modal-sub').value='';
  document.getElementById('modal-muscle').value='chest';
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('modal-name').focus(),100);
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); addingToDayId=null; }
function confirmAddEx(){
  const name=document.getElementById('modal-name').value.trim();
  if(!name) return;
  const sub=document.getElementById('modal-sub').value.trim();
  const muscle=document.getElementById('modal-muscle').value;
  const day=days.find(d=>d.id===addingToDayId);
  if(!day) return;
  day.exercises.push({id:addingToDayId+'_'+Date.now(), name, sub, muscle});
  closeModal();
  collectInputs(); renderPlan(); fillInputs();
  document.getElementById('dc-'+addingToDayId).classList.add('open');
}
function deleteEx(dayId, exId){
  const day=days.find(d=>d.id===dayId);
  if(!day) return;
  day.exercises=day.exercises.filter(e=>e.id!==exId);
  collectInputs(); renderPlan(); fillInputs();
  document.getElementById('dc-'+dayId).classList.add('open');
}

// ─── RENDER ───────────────────────────────────────────────────────────────
function svgIcon(key, w=54, h=54){
  const inner=(M[key]||M.cardio).replace(/<svg[^>]*>/,'').replace('</svg>','');
  return `<div class="muscle-icon" style="width:${w}px;height:${h}px">
    <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">${inner}</svg>
  </div>`;
}

function renderExRow(ex, dayId){
  return `<div class="ex-row" id="er-${ex.id}">
    ${svgIcon(ex.muscle||'cardio')}
    <div class="ex-main">
      <div class="ex-name">${ex.name}</div>
      ${ex.sub?`<div class="ex-sub">${ex.sub}</div>`:''}
      <div class="ex-default">3 × 8–10 повт.</div>
      <div class="ex-fields">
        <div class="field-group">
          <span class="field-lbl">Подходы</span>
          <input class="field-in ex-sets" data-id="${ex.id}" type="text" placeholder="3×10">
        </div>
        <div class="field-group">
          <span class="field-lbl">РВ кг</span>
          <input class="field-in ex-weight" data-id="${ex.id}" type="number" placeholder="0"
            oninput="const h=document.getElementById('wh-${ex.id}');h.textContent='';h.className='weight-hint'">
          <div class="weight-hint" id="wh-${ex.id}"></div>
        </div>
        <div class="field-group">
          <span class="field-lbl">Высота</span>
          <input class="field-in ex-height" data-id="${ex.id}" type="number" placeholder="—"
            min="1" max="9" style="width:60px"
            oninput="this.value=this.value.replace(/[^1-9]/g,'').slice(0,1)">
        </div>
      </div>
    </div>
    <button class="ex-delete" onclick="deleteEx('${dayId}','${ex.id}')" title="Удалить">✕</button>
  </div>`;
}

function renderCardioRow(ex){
  const opts=CARDIO_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('');
  const svgInner=(M.cardio).replace(/<svg[^>]*>/,'').replace('</svg>','');
  return `<div class="cardio-row">
    <div class="cardio-top">
      <div class="cardio-icon"><svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg" width="34" height="34">${svgInner}</svg></div>
      <div><div class="cardio-name">Кардио-сессия</div><div class="cardio-hint">Выбери активность и заполни данные</div></div>
    </div>
    <div class="cardio-fields">
      <div class="field-group"><span class="field-lbl">Тип</span>
        <select class="cardio-sel c-type" data-id="${ex.id}">${opts}</select></div>
      <div class="field-group"><span class="field-lbl">Дистанция км</span>
        <input class="field-in c-dist" data-id="${ex.id}" type="number" placeholder="0.0" style="width:78px"></div>
      <div class="field-group"><span class="field-lbl">Время мин</span>
        <input class="field-in c-time" data-id="${ex.id}" type="number" placeholder="0" style="width:70px"></div>
    </div>
  </div>`;
}

function renderPlan(){
  document.getElementById('page-plan').innerHTML=days.map(day=>{
    const rows=day.exercises.map(ex=>ex.cardio?renderCardioRow(ex):renderExRow(ex,day.id)).join('');
    return `<div class="day-card" id="dc-${day.id}">
      <div class="day-head" onclick="toggleDay('${day.id}')">
        <div><div class="day-title">${day.title}</div><div class="day-focus">${day.focus}</div></div>
        <span class="day-arrow">▾</span>
      </div>
      <div class="day-body">
        ${rows}
        ${!day.cardioDay?`<button class="add-ex-btn" onclick="openAddEx('${day.id}')"><span class="plus">+</span> Добавить упражнение</button>`:''}
      </div>
    </div>`;
  }).join('');
}

function renderRecords(){
  document.getElementById('page-records').innerHTML=
    `<div class="page-title">Рекорды</div><div class="page-sub">Личные максимумы</div>`+
    records.map(rec=>{
      const r=recState[rec.id]||{}, w=parseFloat(r.w)||0, rp=parseFloat(r.r)||1;
      const prm=w>0?Math.round(w*(1+rp/30)):0;
      const svgInner=(M[rec.muscle]||M.back).replace(/<svg[^>]*>/,'').replace('</svg>','');
      return `<div class="rec-card">
        <div class="rec-muscle"><svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">${svgInner}</svg></div>
        <div class="rec-info">
          <div class="rec-name">${rec.name}</div>
          <div class="rec-sub">${rec.sub}</div>
          <div class="rec-fields">
            <div class="field-group"><span class="field-lbl">Вес кг</span>
              <input class="rec-inp rec-w" data-rid="${rec.id}" type="number" placeholder="0" value="${r.w||''}"
                oninput="if(!recState['${rec.id}'])recState['${rec.id}']={};recState['${rec.id}'].w=this.value;updateBadge('${rec.id}')"></div>
            <div class="field-group"><span class="field-lbl">Повт.</span>
              <input class="rec-inp rec-r" data-rid="${rec.id}" type="number" placeholder="1" value="${r.r||''}"
                oninput="if(!recState['${rec.id}'])recState['${rec.id}']={};recState['${rec.id}'].r=this.value;updateBadge('${rec.id}')"></div>
            <div class="field-group" style="justify-content:flex-end">
              <span class="field-lbl" style="opacity:0">x</span>
              <span class="rec-badge" id="badge-${rec.id}" style="${prm>0?'':'display:none'}">${prm>0?'1ПМ ≈ '+prm+' кг':''}</span>
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
}

loadState();
renderPlan();
renderRecords();
document.getElementById('week-label').textContent=getWeekLabel(0);
fillInputs();
document.getElementById('dc-mon').classList.add('open');
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(err => console.warn('SW registration failed:', err));
  });
}
</script>
</body>
</html>
